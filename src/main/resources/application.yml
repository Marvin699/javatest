server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hr_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hrsystem.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.hrsystem: debug
