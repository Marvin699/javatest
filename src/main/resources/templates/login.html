<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 人事管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .login-container { max-width: 400px; margin: 100px auto; }
        .card { box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">人事管理系统</h3>

                <div th:if="${param.error}" class="alert alert-danger">用户名或密码错误</div>
                <div th:if="${param.logout}" class="alert alert-success">已成功退出登录</div>

                <form th:action="@{/doLogin}" method="post">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录</button>
                </form>

                <div class="mt-3 text-muted small">
                    <p>测试账号：</p>
                    <p>管理员：admin / 123456</p>
                    <p>普通员工：emp001 / 123456</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
