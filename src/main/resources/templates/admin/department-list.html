<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理 - 人事管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">人事管理系统</a>
            <div class="navbar-nav">
                <a th:href="@{/admin/dashboard}" class="nav-link">首页</a>
                <a th:href="@{/admin/employee/list}" class="nav-link">员工管理</a>
                <a th:href="@{/admin/department/list}" class="nav-link active">部门管理</a>
            </div>
            <div class="navbar-nav ms-auto">
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="d-flex justify-content-between mb-3">
            <h4>部门列表</h4>
            <a th:href="@{/admin/department/add}" class="btn btn-success">添加部门</a>
        </div>

        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>部门名称</th>
                    <th>部门编号</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dept : ${departments}">
                    <td th:text="${dept.id}"></td>
                    <td>
                        <a th:href="@{/admin/department/detail/{id}(id=${dept.id})}" th:text="${dept.name}" class="text-decoration-none"></a>
                    </td>
                    <td th:text="${dept.code}"></td>
                    <td th:text="${#dates.format(dept.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td>
                        <a th:href="@{/admin/department/edit/{id}(id=${dept.id})}" class="btn btn-sm btn-warning">编辑</a>
                        <a th:href="@{/admin/department/delete/{id}(id=${dept.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('确定要删除该部门吗？')">删除</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(departments)}">
                    <td colspan="5" class="text-center text-muted">暂无数据</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
