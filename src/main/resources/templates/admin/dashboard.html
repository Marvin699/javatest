<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 人事管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">人事管理系统</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" sec:authentication="name">Admin</span>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h4>欢迎回来，管理员！</h4>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <a th:href="@{/admin/employee/list}" class="text-decoration-none">
                    <div class="card bg-info text-white">
                        <div class="card-body text-center">
                            <h5>员工管理</h5>
                            <p>管理员工信息</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a th:href="@{/admin/department/list}" class="text-decoration-none">
                    <div class="card bg-success text-white">
                        <div class="card-body text-center">
                            <h5>部门管理</h5>
                            <p>管理部门信息</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <div class="card bg-warning text-white">
                    <div class="card-body text-center">
                        <h5>操作日志</h5>
                        <p>查看系统日志</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">最近操作日志</h5>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(logs)}" class="text-center text-muted">
                    暂无日志记录
                </div>
                <table th:if="${!#lists.isEmpty(logs)}" class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>操作人</th>
                            <th>操作内容</th>
                            <th>IP地址</th>
                            <th>操作时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td th:text="${log.username}"></td>
                            <td th:text="${log.operation}"></td>
                            <td th:text="${log.ip}"></td>
                            <td th:text="${#dates.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
