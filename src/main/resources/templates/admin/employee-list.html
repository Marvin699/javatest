<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理 - 人事管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">人事管理系统</a>
            <div class="navbar-nav">
                <a th:href="@{/admin/dashboard}" class="nav-link">首页</a>
                <a th:href="@{/admin/employee/list}" class="nav-link active">员工管理</a>
                <a th:href="@{/admin/department/list}" class="nav-link">部门管理</a>
            </div>
            <div class="navbar-nav ms-auto">
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">搜索条件</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/employee/search}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">工号</label>
                        <input type="text" name="empNo" class="form-control" th:value="${empNo}" placeholder="输入工号">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">性别</label>
                        <select name="gender" class="form-select">
                            <option value="">全部</option>
                            <option value="男" th:selected="${gender == '男'}">男</option>
                            <option value="女" th:selected="${gender == '女'}">女</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">职位</label>
                        <input type="text" name="position" class="form-control" th:value="${position}" placeholder="输入职位">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">搜索</button>
                        <a th:href="@{/admin/employee/list}" class="btn btn-secondary">重置</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <h4>员工列表</h4>
            <a th:href="@{/admin/employee/add}" class="btn btn-success">添加员工</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>姓名</th>
                        <th>工号</th>
                        <th>性别</th>
                        <th>职位</th>
                        <th>出生日期</th>
                        <th>部门</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp : ${employees}">
                        <td th:text="${emp.id}"></td>
                        <td th:text="${emp.name}"></td>
                        <td th:text="${emp.empNo}"></td>
                        <td th:text="${emp.gender}"></td>
                        <td th:text="${emp.position}"></td>
                        <td th:text="${#dates.format(emp.birthDate, 'yyyy-MM-dd')}"></td>
                        <td th:text="${emp.departmentName}"></td>
                        <td>
                            <a th:href="@{/admin/employee/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-warning">编辑</a>
                            <a th:href="@{/admin/employee/delete/{id}(id=${emp.id})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('确定要删除该员工吗？')">删除</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="8" class="text-center text-muted">暂无数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
