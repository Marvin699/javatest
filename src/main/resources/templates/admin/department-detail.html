<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门详情 - 人事管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">人事管理系统</a>
            <div class="navbar-nav">
                <a th:href="@{/admin/dashboard}" class="nav-link">首页</a>
                <a th:href="@{/admin/employee/list}" class="nav-link">员工管理</a>
                <a th:href="@{/admin/department/list}" class="nav-link active">部门管理</a>
            </div>
            <div class="navbar-nav ms-auto">
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <h4>
                <span th:text="${department.name}"></span> - 部门员工列表
            </h4>
            <a th:href="@{/admin/department/list}" class="btn btn-secondary">返回列表</a>
        </div>

        <div class="card">
            <div class="card-body">
                <p>部门编号：<span th:text="${department.code}"></span></p>
            </div>
        </div>

        <table class="table table-bordered table-hover mt-3">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>姓名</th>
                    <th>工号</th>
                    <th>性别</th>
                    <th>职位</th>
                    <th>出生日期</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.name}"></td>
                    <td th:text="${emp.empNo}"></td>
                    <td th:text="${emp.gender}"></td>
                    <td th:text="${emp.position}"></td>
                    <td th:text="${#dates.format(emp.birthDate, 'yyyy-MM-dd')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="6" class="text-center text-muted">该部门暂无员工</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
