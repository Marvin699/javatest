<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工编辑 - 人事管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">人事管理系统</a>
            <div class="navbar-nav">
                <a th:href="@{/admin/dashboard}" class="nav-link">首页</a>
                <a th:href="@{/admin/employee/list}" class="nav-link active">员工管理</a>
                <a th:href="@{/admin/department/list}" class="nav-link">部门管理</a>
            </div>
            <div class="navbar-nav ms-auto">
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0" th:text="${employee.id != null ? '编辑员工' : '添加员工'}"></h5>
                    </div>
                    <div class="card-body">
                        <form th:action="${employee.id != null} ? @{/admin/employee/edit} : @{/admin/employee/add}" method="post">
                            <input type="hidden" name="id" th:value="${employee.id}">

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">姓名 <span class="text-danger">*</span></label>
                                    <input type="text" name="name" class="form-control" th:value="${employee.name}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">工号 <span class="text-danger">*</span></label>
                                    <input type="text" name="empNo" class="form-control" th:value="${employee.empNo}" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">性别 <span class="text-danger">*</span></label>
                                    <select name="gender" class="form-select" required>
                                        <option value="">请选择</option>
                                        <option value="男" th:selected="${employee.gender == '男'}">男</option>
                                        <option value="女" th:selected="${employee.gender == '女'}">女</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">职位 <span class="text-danger">*</span></label>
                                    <input type="text" name="position" class="form-control" th:value="${employee.position}" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">出生日期</label>
                                    <input type="date" name="birthDate" class="form-control"
                                           th:value="${employee.birthDate != null ? #dates.format(employee.birthDate, 'yyyy-MM-dd') : ''}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">部门 <span class="text-danger">*</span></label>
                                    <select name="departmentId" class="form-select" required>
                                        <option value="">请选择部门</option>
                                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"
                                                th:selected="${employee.departmentId == dept.id}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">登录用户名 <span class="text-danger">*</span></label>
                                    <input type="text" name="username" class="form-control" th:value="${employee.username}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:text="${employee.id != null ? '密码（留空不修改）' : '密码 *'}"></label>
                                    <input type="password" name="password" class="form-control"
                                           th:required="${employee.id == null}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">角色 <span class="text-danger">*</span></label>
                                <select name="role" class="form-select" required>
                                    <option value="EMPLOYEE" th:selected="${employee.role == 'EMPLOYEE'}">普通员工</option>
                                    <option value="ADMIN" th:selected="${employee.role == 'ADMIN'}">管理员</option>
                                </select>
                            </div>

                            <div class="text-end">
                                <a th:href="@{/admin/employee/list}" class="btn btn-secondary me-2">取消</a>
                                <button type="submit" class="btn btn-primary">保存</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
