<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的部门 - 人事管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-info">
        <div class="container">
            <a class="navbar-brand" href="#">人事管理系统</a>
            <div class="navbar-nav">
                <a th:href="@{/employee/dashboard}" class="nav-link active">我的部门</a>
            </div>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    <span th:text="${currentEmployee.name}"></span>
                    (<span th:text="${currentEmployee.departmentName}"></span>)
                </span>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h4>欢迎，<span th:text="${currentEmployee.name}"></span>！</h4>
                <p class="text-muted">您所在的部门：<span th:text="${currentEmployee.departmentName}"></span></p>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">本部门同事信息</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>姓名</th>
                                <th>工号</th>
                                <th>性别</th>
                                <th>职位</th>
                                <th>出生日期</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="emp : ${colleagues}">
                                <td th:text="${emp.name}"></td>
                                <td th:text="${emp.empNo}"></td>
                                <td th:text="${emp.gender}"></td>
                                <td th:text="${emp.position}"></td>
                                <td th:text="${#dates.format(emp.birthDate, 'yyyy-MM-dd')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
